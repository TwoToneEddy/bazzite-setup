################################################################################
# MangoHud - built to match the MSI Afterburner OSD from the Windows install.
#
# Source of truth:
#   /run/media/lee/9AD6814BD6812919/Program Files (x86)/MSI Afterburner/
#       Profiles/MSIAfterburner.cfg   (the [Source *] sections, ShowInOSD=1)
#
# That file turns on exactly thirteen things, in this order:
#   GPU temperature, GPU usage, GPU memory usage, GPU core clock, GPU power,
#   GPU voltage, CPU temperature, CPU power, RAM usage, Framerate, Frametime
#   (with graph), Framerate 1% Low, Framerate 0.1% Low.
# All thirteen are below. GPU voltage takes a detour - MangoHud cannot read it
# on this card - see the note in the GPU section.
# Everything else Afterburner can show is switched off, including CPU usage,
# the per-core graphs and the second GPU.
#
# Two things here that Afterburner did not show:
#   - the 12V-2x6 per-pin current rows at the bottom, which it has no equivalent
#     for at all
#   - GPU memory clock, added by request
#
# Toggle the overlay with  /  (forward slash).
#   Shift_L + F1   cycle the FPS limiter
#   Shift_L + F2   start / stop frametime logging to ~/mangohud-logs
#   Shift_L + F4   reload this file
################################################################################

toggle_hud=slash
toggle_hud_position=Shift_L+F11
toggle_fps_limit=Shift_L+F1
toggle_logging=Shift_L+F2
reload_cfg=Shift_L+F4

################################  APPEARANCE  ##################################
# Colours lifted from Afterburner's "modern" OSD layout (OSDLayout = 1):
#   <C0=008040> GPU group, <C1=0080C0> CPU group, <C2=C08080> framerate group,
#   <C4=FFFFFF> values.
legacy_layout=false
# Where the overlay sits on screen. One of:
#   top-left      top-center      top-right
#   middle-left                   middle-right
#   bottom-left   bottom-center   bottom-right
# Shift_L+F11 cycles it in-game without editing anything.
position=top-left
font_size=22
font_size_text=22
table_columns=3
background_alpha=0.45
alpha=0.9
round_corners=8
hud_no_margin=false
text_outline
text_outline_color=000000
background_color=000000
text_color=FFFFFF
gpu_color=008040
vram_color=008040
cpu_color=0080C0
ram_color=0080C0
engine_color=C08080
frametime_color=00FF00

# The ORDER of the blocks below is the order they appear in the overlay, and
# moving a block in this file moves it on screen - checked by screenshot. So to
# put the 12V-2x6 rows at the top, cut that whole block and paste it above the
# GPU section.

################################  GPU  #########################################
# Show the RTX 5090 only; index 0 is the Radeon iGPU in the 9800X3D. Afterburner
# hides its first GPU the same way (GPU1 temperature -> ShowInOSD=0).
# Selected by PCI address rather than gpu_list index: the index depends on what
# order MangoHud enumerates cards in, which is not guaranteed to be the same
# inside Steam's container. If it ever points at nothing, MangoHud silently drops
# the GPU and VRAM rows and keeps the rest - so a missing GPU row means this line.
pci_dev=0000:01:00.0
gpu_stats
gpu_temp
gpu_core_clock
# Needs vram (below) enabled - MangoHud drops gpu_mem_clock without it.
# It shares the VRAM row rather than getting a labelled row of its own.
# Agrees with LACT: both read 405 MHz at idle and 810 MHz under light load,
# checked side by side. The clock bounces between idle and ~7000 MHz several
# times a second, so a still of the overlay rarely matches a nvidia-smi run a
# moment later - that is the clock moving, not a disagreement.
gpu_mem_clock
gpu_power
vram

# Peak GPU temperature and power draw this session. MangoHud has no max/peak
# tracking of its own - there is no gpu_temp_max parameter - so gpu-peaks.service
# (a user service, ~/.local/bin/gpu-peaks) reads NVML once a second and publishes
# the running maximum to /dev/shm, exactly like the 12V-2x6 rows.
# Zero them with `gpu-peaks --reset`; the Superposition launcher does that itself.
custom_text=MAX TEMP
exec=cat /dev/shm/gpu-peaks.temp
custom_text=MAX POWER
exec=cat /dev/shm/gpu-peaks.power

# Core voltage. MangoHud's own gpu_voltage is left off deliberately: it reads
# NVIDIA cards through NVML, and NVML has no voltage API - no voltage symbol in
# libnvidia-ml.so.1, and `nvidia-smi -q -d VOLTAGE` prints an empty section - so
# the built-in row sits at a permanent 0 mV.
#
# LACT gets it through NvAPI instead, so gpu-voltage.service (a user service,
# ~/.local/bin/gpu-voltage) asks lactd once a second and publishes the answer to
# /dev/shm, the same pattern as the peaks and 12V-2x6 rows. One `lact cli stats`
# costs ~16 ms, which is why this is a daemon and a file rather than an exec here.
custom_text=VOLTAGE
exec=cat /dev/shm/gpu-voltage.mv

################################  CPU  #########################################
# Afterburner has CPU usage OFF and only shows temperature and power. MangoHud
# draws all three on one row and drops the whole row if cpu_stats is off, so the
# usage percentage has to stay. Verified: cpu_stats=0 removes temp and power too.
cpu_stats
cpu_temp
cpu_power
ram

################################  FRAME / FPS  #################################
fps
frametime
# Frametime is the only Afterburner item with OSDItemType=1, i.e. text + graph.
frame_timing
# 0.01 = 1% low, 0.001 = 0.1% low. No "avg" - Afterburner does not show one.
fps_metrics=0.01,0.001

##############################  12V-2x6 CONNECTOR  #############################
# Per-pin current from the Astral's IT8915FN, published once a second by
# astral-pins.service. One pin per row, two decimals, amps.
#
# " !!" appears on the end of whichever pin has passed 9.0 A, and at the same
# moment astral-pins.service fires /usr/local/bin/astral-pins-alarm, which puts
# a critical notification and three alarm tones into the desktop session and
# repeats every 30 s until the current drops back.
#
# The files live in /dev/shm, NOT /run. Steam runs games inside a pressure-vessel
# container with its own /run, so anything written to /run/ is invisible to them
# and these rows come out blank in every Steam game. /dev/shm is shared through,
# and is still tmpfs, so there is no disk traffic. Verified from inside the
# container both ways.
#
# One file per pin because MangoHud renders only the LAST line an `exec` prints,
# so a row can only ever show one file's worth of text.
custom_text_center=12V-2x6
custom_text=PIN 1
exec=cat /dev/shm/astral-pins.pin1
custom_text=PIN 2
exec=cat /dev/shm/astral-pins.pin2
custom_text=PIN 3
exec=cat /dev/shm/astral-pins.pin3
custom_text=PIN 4
exec=cat /dev/shm/astral-pins.pin4
custom_text=PIN 5
exec=cat /dev/shm/astral-pins.pin5
custom_text=PIN 6
exec=cat /dev/shm/astral-pins.pin6

################################  FPS LIMITER  #################################
# Shift_L+F1 cycles through these. 276 keeps a little headroom under the panel's
# 280 Hz so G-Sync stays in charge. 0 = unlimited.
fps_limit=276,59,115,280,0,240,144,120,60
fps_limit_method=late

################################  LOGGING  #####################################
output_folder=/var/home/lee/mangohud-logs
log_duration=1200
autostart_log=0
log_interval=0

################################  BLACKLIST  ###################################
# Never attach the overlay to the desktop, the Steam client, or browsers.
blacklist=kwin_wayland,kwin_x11,plasmashell,krunner,kded6,ksmserver,xdg-desktop-portal,xdg-desktop-portal-kde,Xwayland,gnome-shell,steam,steamwebhelper,gamescope,gamescopereaper,discord,Discord,chrome,google-chrome,chromium,firefox,code,pipewire,wireplumber,plasma-systemmonitor,systemsettings,dolphin,konsole,lact,coolercontrol,goverlay
