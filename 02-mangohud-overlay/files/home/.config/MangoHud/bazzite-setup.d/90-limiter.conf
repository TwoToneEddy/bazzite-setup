################################  FPS LIMITER  #################################
# Shift_L+F1 toggles between the cap and 0 (unlimited). This is only the
# default, the AOC's: each display-profile launcher (01) rewrites it for its
# screen - see the *_CAP values at the top of display-profile.
fps_limit=250,0
# early paces frames more evenly; late shaves a little input latency but let the
# frame intervals wander, which a VRR panel's refresh counter shows plainly.
fps_limit_method=early
# The row showing the active cap (show_fps_limit) is in 30-cpu-fps.conf, above
# the pin currents: the position of the key decides where the row is drawn.

################################  LOGGING  #####################################
output_folder=/var/home/lee/mangohud-logs
log_duration=1200
autostart_log=0
log_interval=0

################################  BLACKLIST  ###################################
# Never attach the overlay to the desktop, the Steam client, or browsers.
blacklist=kwin_wayland,kwin_x11,plasmashell,krunner,kded6,ksmserver,xdg-desktop-portal,xdg-desktop-portal-kde,Xwayland,gnome-shell,steam,steamwebhelper,gamescope,gamescopereaper,discord,Discord,chrome,google-chrome,chromium,firefox,code,pipewire,wireplumber,plasma-systemmonitor,systemsettings,dolphin,konsole,lact,coolercontrol,goverlay
