################################  FPS LIMITER  #################################
# Shift_L+F1 cycles through these. 276 keeps a little headroom under the panel's
# 280 Hz so G-Sync stays in charge. 0 = unlimited.
fps_limit=276,59,115,280,0,240,144,120,60
fps_limit_method=late

################################  LOGGING  #####################################
output_folder=/var/home/lee/mangohud-logs
log_duration=1200
autostart_log=0
log_interval=0

################################  BLACKLIST  ###################################
# Never attach the overlay to the desktop, the Steam client, or browsers.
blacklist=kwin_wayland,kwin_x11,plasmashell,krunner,kded6,ksmserver,xdg-desktop-portal,xdg-desktop-portal-kde,Xwayland,gnome-shell,steam,steamwebhelper,gamescope,gamescopereaper,discord,Discord,chrome,google-chrome,chromium,firefox,code,pipewire,wireplumber,plasma-systemmonitor,systemsettings,dolphin,konsole,lact,coolercontrol,goverlay
