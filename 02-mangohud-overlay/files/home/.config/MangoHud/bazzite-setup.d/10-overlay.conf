################################################################################
# MangoHud - built to match the MSI Afterburner OSD from the Windows install.
#
# Source of truth:
#   /run/media/lee/9AD6814BD6812919/Program Files (x86)/MSI Afterburner/
#       Profiles/MSIAfterburner.cfg   (the [Source *] sections, ShowInOSD=1)
#
# That file turns on exactly thirteen things, in this order:
#   GPU temperature, GPU usage, GPU memory usage, GPU core clock, GPU power,
#   GPU voltage, CPU temperature, CPU power, RAM usage, Framerate, Frametime
#   (with graph), Framerate 1% Low, Framerate 0.1% Low.
# All thirteen are in the assembled file. GPU voltage takes a detour - MangoHud
# cannot read it on this card - so its row is 20-voltage.conf, from
# 08-gpu-undervolt, which is what runs the LACT daemon it reads.
# Everything else Afterburner can show is switched off, including CPU usage,
# the per-core graphs and the second GPU.
#
# Two things here that Afterburner did not show:
#   - the 12V-2x6 per-pin current rows (50-pins.conf, from 05-per-pin-current),
#     which it has no equivalent for at all
#   - GPU memory clock, added by request
#
# Toggle the overlay with  /  (forward slash).
#   Shift_L + F1   toggle the FPS limiter (screen's cap <-> unlimited)
#   Shift_L + F2   start / stop frametime logging to ~/mangohud-logs
#   Shift_L + F4   reload this file
#
# This is one piece of MangoHud.conf. 02-mangohud-overlay's install.sh joins every
# ~/.config/MangoHud/bazzite-setup.d/*.conf in name order into MangoHud.conf, so
# a row exists only if the component that feeds it is installed.
################################################################################

toggle_hud=slash
toggle_hud_position=Shift_L+F11
toggle_fps_limit=Shift_L+F1
toggle_logging=Shift_L+F2
reload_cfg=Shift_L+F4

################################  APPEARANCE  ##################################
# Colours lifted from Afterburner's "modern" OSD layout (OSDLayout = 1):
#   <C0=008040> GPU group, <C1=0080C0> CPU group, <C2=C08080> framerate group,
#   <C4=FFFFFF> values.
legacy_layout=false
# Where the overlay sits on screen. One of:
#   top-left      top-center      top-right
#   middle-left                   middle-right
#   bottom-left   bottom-center   bottom-right
# Shift_L+F11 cycles it in-game without editing anything.
position=top-left
font_size=22
font_size_text=22
table_columns=3
background_alpha=0.45
alpha=0.9
round_corners=8
hud_no_margin=false
text_outline
text_outline_color=000000
background_color=000000
text_color=FFFFFF
gpu_color=008040
vram_color=008040
cpu_color=0080C0
ram_color=0080C0
engine_color=C08080
frametime_color=00FF00

# The ORDER of the blocks is the order they appear in the overlay, and moving a
# block moves it on screen - checked by screenshot. Pieces are joined in name
# order, so to put the 12V-2x6 rows at the top, rename 50-pins.conf to sort
# between 10-overlay.conf's appearance settings and its GPU block - which means
# splitting this file there.

################################  GPU  #########################################
# Show the RTX 5090 only; index 0 is the Radeon iGPU in the 9800X3D. Afterburner
# hides its first GPU the same way (GPU1 temperature -> ShowInOSD=0).
# Selected by PCI address rather than gpu_list index: the index depends on what
# order MangoHud enumerates cards in, which is not guaranteed to be the same
# inside Steam's container. If it ever points at nothing, MangoHud silently drops
# the GPU and VRAM rows and keeps the rest - so a missing GPU row means this line.
pci_dev=0000:01:00.0
gpu_stats
gpu_temp
gpu_core_clock
# Needs vram (below) enabled - MangoHud drops gpu_mem_clock without it.
# It shares the VRAM row rather than getting a labelled row of its own.
# Agrees with LACT: both read 405 MHz at idle and 810 MHz under light load,
# checked side by side. The clock bounces between idle and ~7000 MHz several
# times a second, so a still of the overlay rarely matches a nvidia-smi run a
# moment later - that is the clock moving, not a disagreement.
gpu_mem_clock
gpu_power
vram

# Peak GPU temperature and power draw this session. MangoHud has no max/peak
# tracking of its own - there is no gpu_temp_max parameter - so gpu-peaks.service
# (a user service, ~/.local/bin/gpu-peaks) reads NVML once a second and publishes
# the running maximum to /dev/shm, exactly like the 12V-2x6 rows.
# Zero them with `gpu-peaks --reset`; the Superposition launcher does that itself.
custom_text=MAX TEMP
exec=cat /dev/shm/gpu-peaks.temp
custom_text=MAX POWER
exec=cat /dev/shm/gpu-peaks.power
