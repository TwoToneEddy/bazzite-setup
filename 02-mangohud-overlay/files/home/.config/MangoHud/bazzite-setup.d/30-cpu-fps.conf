################################  CPU  #########################################
# Afterburner has CPU usage OFF and only shows temperature and power. MangoHud
# draws all three on one row and drops the whole row if cpu_stats is off, so the
# usage percentage has to stay. Verified: cpu_stats=0 removes temp and power too.
cpu_stats
cpu_temp
cpu_power
ram

################################  FRAME / FPS  #################################
fps
frametime
# The FPS limit row (Shift_L+F1's state). Here, between the FPS row and the
# graph, so it sits above the 12V-2x6 pin currents. It shows a cap of 0 while
# the limiter is off, so the rows below never move when it is toggled.
show_fps_limit
# Frametime is the only Afterburner item with OSDItemType=1, i.e. text + graph.
frame_timing
# No 1% / 0.1% lows: the Windows OSD does not actually show them on screen.
