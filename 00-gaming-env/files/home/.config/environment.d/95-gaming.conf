# gaming-env.conf - environment applied to Steam and everything it launches.
#
# Read by ~/.local/bin/steam-gaming, which the Steam launcher runs. Plain
# KEY=VALUE lines, '#' comments. Changes take effect the next time Steam
# starts (fully quit Steam, then start it again).
#
# The DLSS debug indicator is NOT set here: `dlss overlay on|off` writes it into
# each game's prefix registry, so it needs no Steam restart. Setting
# DXVK_NVAPI_SET_NGX_DEBUG_OPTIONS here would override that at every launch.
# (steam-gaming exports it EMPTY on purpose - see 00-gaming-env/README.md.)
# DLSS presets are not set here - RHI does that.

# --- performance overlay ------------------------------------------------------
# MangoHud on every game. Toggle it in-game with '/'. See ~/.config/MangoHud/.
MANGOHUD=1

# --- DLSS runtime -------------------------------------------------------------
# GE-Proton injects the newest DLSS DLLs at launch, leaving the game folder
# untouched (so anticheat sees stock files). Without it Hunt runs its own 3.7.10
# and RHI's K/L/M presets fall back to E. '1' = newest, or pin e.g. 310.9.1.0.
PROTON_DLSS_UPGRADE=1

# --- HDR -----------------------------------------------------------------------
# HDR only reaches a Proton game if the game presents through Wayland directly.
# On XWayland the desktop compositor tone-maps the game's SDR output into the
# HDR screen instead, which is why Hunt said the monitor had no HDR support.
# PROTON_ENABLE_HDR sets DXVK_HDR=1 internally. Both need Proton GE or EM.
PROTON_ENABLE_WAYLAND=1
PROTON_ENABLE_HDR=1

