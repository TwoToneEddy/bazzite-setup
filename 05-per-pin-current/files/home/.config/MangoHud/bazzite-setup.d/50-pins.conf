##############################  12V-2x6 CONNECTOR  #############################
# Per-pin current from the Astral's IT8915FN, published once a second by
# astral-pins.service. One pin per row, two decimals, amps.
#
# " !!" appears on the end of whichever pin has passed 9.0 A, and at the same
# moment astral-pins.service fires /usr/local/bin/astral-pins-alarm, which puts
# a critical notification and three alarm tones into the desktop session and
# repeats every 30 s until the current drops back.
#
# The files live in /dev/shm, NOT /run. Steam runs games inside a pressure-vessel
# container with its own /run, so anything written to /run/ is invisible to them
# and these rows come out blank in every Steam game. /dev/shm is shared through,
# and is still tmpfs, so there is no disk traffic. Verified from inside the
# container both ways.
#
# One file per pin because MangoHud renders only the LAST line an `exec` prints,
# so a row can only ever show one file's worth of text.
custom_text_center=12V-2x6
custom_text=PIN 1
exec=cat /dev/shm/astral-pins.pin1
custom_text=PIN 2
exec=cat /dev/shm/astral-pins.pin2
custom_text=PIN 3
exec=cat /dev/shm/astral-pins.pin3
custom_text=PIN 4
exec=cat /dev/shm/astral-pins.pin4
custom_text=PIN 5
exec=cat /dev/shm/astral-pins.pin5
custom_text=PIN 6
exec=cat /dev/shm/astral-pins.pin6
