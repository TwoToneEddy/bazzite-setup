##############################  12V-2x6 CONNECTOR  #############################
# Per-pin current from the Astral's IT8915FN, published once a second by
# astral-pins.service. One pin per row, pin 1 at the top, no labels - copied
# from the Windows Afterburner OSD (02-mangohud-overlay/Screenshot_*.png):
#
#   7.260 A
#   6.940 A
#   ...
#   9.210 A !!     <- this pin is over the limit
#
# Named 35- so it lands under the frametime graph and the FPS limit row, both in
# 30-cpu-fps.conf.
#
# Each row is an empty custom_text followed by the exec. MangoHud 0.8.4 puts every
# custom_text and exec in the next cell of the 5-column table, and a bare list of
# execs runs across the row instead of down it. The pair stacks one per row, the
# same way VOLTAGE / PROFILE do. The value is right-aligned in the second column.
# Checked by screenshot.
#
# The size comes from font_size_secondary in 10-overlay.conf: every custom row is
# drawn in MangoHud's secondary font, which is otherwise 0.55x the main one.
#
# " !!" appears after whichever pin has passed 9.0 A, and at the same moment
# astral-pins.service runs /usr/local/bin/astral-pins-alarm: a critical
# notification and alarm tones in the desktop session, repeated every 30 s until
# the current drops back.
#
# The files live in /dev/shm, NOT /run. Steam runs games inside a pressure-vessel
# container with its own /run, so anything written to /run/ is invisible to them
# and these rows come out blank in every Steam game. /dev/shm is shared through,
# and is still tmpfs, so there is no disk traffic.
#
# One file per pin because MangoHud renders only the LAST line an `exec` prints.
custom_text= 
exec=cat /dev/shm/astral-pins.pin1
custom_text= 
exec=cat /dev/shm/astral-pins.pin2
custom_text= 
exec=cat /dev/shm/astral-pins.pin3
custom_text= 
exec=cat /dev/shm/astral-pins.pin4
custom_text= 
exec=cat /dev/shm/astral-pins.pin5
custom_text= 
exec=cat /dev/shm/astral-pins.pin6
