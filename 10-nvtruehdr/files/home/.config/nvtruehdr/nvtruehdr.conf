# nvtruehdr settings - read live by the nvtruehdr Vulkan layer.
#
# A game is only converted if it has a [Game.exe] section below (use the
# `nvtruehdr` command, or add one by hand), or runs with NVTRUEHDR=1.
# Edits take effect while the game is running.
#
# [global] holds the defaults; a game's own section overrides them.
# Run `nvtruehdr --help` for the list of settings.

[global]
peak_brightness = 450    # from KDE (DP-1)
middle_grey = 50
contrast = 100
saturation = 0
quality = high
sdr_white = 450          # KDE's SDR brightness
hud_position = top-right

# Example game profile - `nvtruehdr "Game.exe" high` writes one of these:
# [Game.exe]
# enabled = 1
# quality = high
# hud = 1
