# The LACT row, straight under the GPU row, in the GPU row's columns:
#
#   GPU      5%     44°C    2677MHz   72.0W
#   LACT    UV1    1060mV
#
# Active profile under the GPU usage, core voltage under the temperature. The
# two `exec=true` lines are empty cells filling columns 4-5, so VRAM (22-vram.conf,
# from 02) starts a row of its own. `true` is a builtin of the shell MangoHud
# keeps open for exec, so they cost nothing. Checked by screenshot.
#
# The Afterburner OSD has the voltage on the GPU row itself, but MangoHud 0.8.4
# ends the GPU row with a hard row break, so nothing from a config can join it.
#
# MangoHud's own gpu_voltage is left off deliberately: it reads NVIDIA cards
# through NVML, and NVML has no voltage API - no voltage symbol in
# libnvidia-ml.so.1, and `nvidia-smi -q -d VOLTAGE` prints an empty section - so
# the built-in value sits at a permanent 0.
#
# LACT gets it through NvAPI instead, so gpu-voltage.service (a user service,
# ~/.local/bin/gpu-voltage) asks lactd once a second and publishes the voltage
# and the active profile to /dev/shm, the same pattern as the 12V-2x6 rows. One
# `lact cli stats` costs ~16 ms, which is why this is a daemon and a file rather
# than an exec here. gpu-profile also writes the profile the moment it switches.
custom_text=LACT
exec=cat /dev/shm/gpu-profile.name
exec=cat /dev/shm/gpu-voltage.mv
exec=true
exec=true
