# Core voltage. MangoHud's own gpu_voltage is left off deliberately: it reads
# NVIDIA cards through NVML, and NVML has no voltage API - no voltage symbol in
# libnvidia-ml.so.1, and `nvidia-smi -q -d VOLTAGE` prints an empty section - so
# the built-in row sits at a permanent 0 mV.
#
# LACT gets it through NvAPI instead, so gpu-voltage.service (a user service,
# ~/.local/bin/gpu-voltage) asks lactd once a second and publishes the answer to
# /dev/shm, the same pattern as the peaks and 12V-2x6 rows. One `lact cli stats`
# costs ~16 ms, which is why this is a daemon and a file rather than an exec here.
custom_text=VOLTAGE
exec=cat /dev/shm/gpu-voltage.mv

# Active LACT profile (UV1, Overclock1, ...). gpu-voltage.service publishes it
# alongside the voltage; gpu-profile also writes it the moment it switches.
custom_text=PROFILE
exec=cat /dev/shm/gpu-profile.name
