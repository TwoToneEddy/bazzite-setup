# machine-profile.conf - the hardware this configuration was built for.
#
# Every hardware-specific value in gamingConfig is recorded once here, next to the
# file that hardcodes it. That makes porting to a new machine a matter of working
# down one list rather than grepping twelve components for PCI addresses.
#
# Nothing reads this file at install time - the components hold their own values,
# because a config file that silently disagrees with the script beside it is worse
# than no config file. This is the reference, and preflight.sh is what compares it
# against the machine you are actually on.
#
# Shell-sourceable: KEY="value", '#' comments.

PROFILE_NAME="bazzite-5090-astral"
PROFILE_DATE="2026-09-28"

# --- the machine --------------------------------------------------------------
OS="Bazzite 44 (Fedora Kinoite 44), KDE Plasma 6.6 Wayland, rpm-ostree"
CPU="AMD Ryzen 7 9800X3D"
MOTHERBOARD="SAPPHIRE NITRO+ B850M WIFI"
SUPERIO="NCT6799D"                  # needs the nct6775 module - 00-prerequisites
GPU="NVIDIA RTX 5090 ROG Astral OC"
NVIDIA_DRIVER="610.57.04"           # what it was last verified on

# --- GPU identity, in the three different formats things want it --------------
# PCI address.  MangoHud's pci_dev=. Find it: lspci -D | grep -i vga
GPU_PCI="0000:01:00.0"
# PCI vendor:device and subsystem. The subsystem is what makes it an ASUS Astral
# rather than any other 5090, which is what 01-per-pin-current depends on.
GPU_PCI_ID="10de:2b85"
GPU_SUBSYSTEM_ID="1043:89e3"
# LACT's own id. Used by 02's gpu-voltage and by every `lact cli -g` call.
# Find it: lact cli list-gpus
GPU_LACT_ID="10DE:2B85-1043:89E3-0000:01:00.0"
# The iGPU, which is why nothing may be left to pick "GPU 0" by default.
IGPU_LACT_ID="1002:13C0-1002:13C0-0000:0a:00.0"

# --- 12V-2x6 per-pin sensor (01) ----------------------------------------------
# Astral-only hardware. astral-pins autodetects the bus, so BUS is informational.
PINS_CHIP="ITE IT8915FN"
PINS_I2C_BUS="i2c-7"                # NVIDIA i2c adapter 1 at 1:00.0
PINS_I2C_ADDR="0x2b"
PINS_REGISTER="0x80"                # six [mV hi][mV lo][mA hi][mA lo], big-endian
PINS_WARN_AMPS="9.0"

# --- displays (05) ------------------------------------------------------------
# Output names come from kscreen-doctor -o. The EDID id in the comment is the
# reliable identifier; connector names move when you change port or cable.
AOC_OUT="DP-4";       AOC_MODE="2560x1440@280"     # AOCA610 - AOC AG276QZD2
DELL_OUT="HDMI-A-3";  DELL_MODE="1920x1200@59.95"  # DELF048 - Dell U2413
TV_OUT="HDMI-A-2";    TV_MODE="3840x2160@60"       # PHL0B82 - Philips 48OLED707
# Note: this TV currently advertises NO 4K120 mode on this port - its best are
# 3840x2160@60 and 2560x1440@120. See 05-display-switching/README.md.

# --- fans (07) ----------------------------------------------------------------
# NCT6799D channel names as CoolerControl shows them.
FAN_MIX="fan1 fan2 fan3"            # Main Mix = Max(GPU curve, CPU curve)
FAN_GPU="fan6"                      # GPU curve only
FAN_PUMP="fan7"                     # left on BIOS control, deliberately
CPU_TEMP_SENSOR="k10temp Tctl"

# --- undervolt (08) -----------------------------------------------------------
# Silicon-specific. Do not adopt these on another card without validating.
UV_PROFILE="UV"
UV_TARGET="950 mV @ 2850 MHz"
UV_MAX_CORE_CLOCK="2851"
STOCK_CURVE="2700MHz@975mV, 2917MHz@1050mV, 3135MHz@1170mV"

# --- external sources this was ported FROM ------------------------------------
# A Windows install on the other drive. Not needed to reinstall, but this is where
# the curves and layouts were decoded from, if anything ever needs re-deriving.
WIN_MOUNT="/run/media/lee/9AD6814BD6812919"
WIN_AFTERBURNER="$WIN_MOUNT/Program Files (x86)/MSI Afterburner/Profiles/MSIAfterburner.cfg"
WIN_FANCONTROL="$WIN_MOUNT/Program Files (x86)/FanControl/Configurations"
WIN_DISPLAYSWITCH="$WIN_MOUNT/ConfigUtils/scripts/DisplaySwitch"
WIN_DLSSOVERLAY="$WIN_MOUNT/ConfigUtils/scripts/DlssOverlay"

# --- external git repos -------------------------------------------------------
NVTRUEHDR_REPO="https://github.com/TwoToneEddy/nvtruehdr"
